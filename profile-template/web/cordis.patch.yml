# Use the in-app directory browser so remote and mobile clients never invoke a host OS dialog.
- id: directory-picker
  disabled: true

- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'

    - id: directory-picker-browse-ui
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'

# Bundle the Lulu theme plugin directly into this portable Harness build so it is
# available by default when the app opens.
- insert:
    - id: lulu-theme
      name: './plugins/dsh-theme-lulu/lib/index.js'
